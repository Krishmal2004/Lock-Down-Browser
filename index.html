<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Exam Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        h1 { color: #2c3e50; }
        p { color: #7f8c8d; line-height: 1.6; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
            cursor: pointer;
            border: none;
        }
        .btn:hover { background-color: #2980b9; }
        .status-badge {
            margin-top: 15px;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            display: inline-block;
        }
        .locked { background: #e74c3c; color: white; }
        .unlocked { background: #2ecc71; color: white; }
        #exitBtn { background-color: #e67e22; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="title">Exam Gateway</h1>
    <p id="instruction">Click the button below to launch the secure lockdown environment and begin your assessment.</p>
    
    <a href="lockdown://launch" class="btn" id="launchBtn">Launch Lockdown Browser</a>
    
    <button class="btn" id="exitBtn" onclick="terminateSession()">Finish & Exit Exam</button>

    <div id="status" class="status-badge unlocked">Status: Standard Browser</div>
</div>

<script>
    // 1. Detect if we are inside the Lockdown App
    // We check for the 'lockdownSystem' object we exposed in preload.js
    const isLockdown = window.lockdownSystem !== undefined;

    const launchBtn = document.getElementById('launchBtn');
    const exitBtn = document.getElementById('exitBtn');
    const statusDiv = document.getElementById('status');
    const title = document.getElementById('title');

    if (isLockdown) {
        // We are INSIDE the app
        launchBtn.style.display = 'none';
        exitBtn.style.display = 'inline-block';
        statusDiv.innerText = "Status: SECURE LOCKDOWN ACTIVE";
        statusDiv.className = "status-badge locked";
        title.innerText = "Active Exam Session";
    }

    function terminateSession() {
        if (confirm("Are you sure you want to submit and close the exam?")) {
            // Call the Electron function via the preload bridge
            window.lockdownSystem.finishQuiz();
        }
    }
</script>

</body>
</html>
